name: 🚀 Deploy to Hostinger VPS

on:
  push:
    branches:
      - main  # main branch pe push hone pe auto-deploy

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mla-platform/package-lock.json

      - name: 📦 Install Dependencies
        working-directory: mla-platform
        run: npm ci

      - name: 🏗️ Build Next.js App
        working-directory: mla-platform
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXTAUTH_URL }}
          NODE_ENV: production
        run: npm run build

      - name: 📤 Deploy to VPS via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          source: |
            mla-platform/.next/standalone/
            mla-platform/.next/static/
            mla-platform/public/
            mla-platform/ecosystem.config.js
            mla-platform/prisma/schema.prisma
          target: /tmp/mla-deploy
          strip_components: 1

      - name: 🔄 Restart App on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            # Files move karo
            sudo rm -rf /var/www/mla-platform/.next
            sudo rm -rf /var/www/mla-platform/public

            sudo mkdir -p /var/www/mla-platform/.next
            sudo cp -r /tmp/mla-deploy/mla-platform/.next/standalone/. /var/www/mla-platform/
            sudo mkdir -p /var/www/mla-platform/.next/static
            sudo cp -r /tmp/mla-deploy/mla-platform/.next/static/. /var/www/mla-platform/.next/static/
            sudo cp -r /tmp/mla-deploy/mla-platform/public/. /var/www/mla-platform/public/
            sudo cp /tmp/mla-deploy/mla-platform/ecosystem.config.js /var/www/mla-platform/
            sudo chown -R $USER:$USER /var/www/mla-platform

            # Prisma migrate (database update)
            cd /var/www/mla-platform
            export DATABASE_URL="${{ secrets.DATABASE_URL }}"
            npx prisma db push --skip-generate || echo "Prisma push skipped"

            # PM2 restart
            mkdir -p logs
            pm2 restart mla-platform 2>/dev/null || pm2 start ecosystem.config.js
            pm2 save

            # Cleanup
            sudo rm -rf /tmp/mla-deploy

            echo "✅ Deployment complete!"
